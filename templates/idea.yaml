# Idea template (schema_version 1). Copy to channel/<name>/ideas/NNN-slug/idea.yaml.
# Keep this file OUT of ideas/ (video-generator `video.py batch` treats every ideas/ subfolder as an idea).
# idea.yaml is the source of truth; idea.md is the human summary (keep in sync).

todo: []                     # seeded ideas list what is still to fill; validate_idea.py fails while this is not empty
schema_version: 1
id: idea-NNN
slug:
title_working:
channel:
status: draft                # draft | proposed | approved | rejected | promoted | published
status_log: []               # [{date, status, by, note}]
album: null
created_at:
updated_at:

brief:                       # ý tưởng gốc (CLAUDE.md §0): từ trend (R&D) hoặc từ CEO/PM
  source:                    # trend | ceo | pm
  text:                      # một–hai câu: album nói về gì (chủ đề trend, hoặc câu chuyện: ai, ở đâu, mong điều gì)
  topic:                     # chủ đề trend (channel/<ch>/trends.yaml topics) để đánh giá theo trục chủ đề
  trend_report:              # research/trends/<ch>/reports/YYYY-MM-DD.md
  angle:                     # ý tưởng gặp trend ở đâu: câu chuyện, ai hát cho ai, vì sao người xem bấm
  decisions:                 # PM quyết (CLAUDE.md §0), mọi nhân viên làm theo; null = nhân viên tự chọn trong luật kênh
    by:                      # "PM YYYY-MM-DD"
    music: {voice: , tempo: , meter: , branch: , experiment: , library: [], public_domain: []}
    title_direction:         # giọng + khuôn title của video này (theo direction.md)
    description_angle:       # ABOUT THIS VIDEO nói gì, cho ai
    thumbnail_concept:       # concept đã chọn (R&D Ý tưởng thumbnail): cảnh, chủ thể, chữ chính (visual.md → Chữ chính trên ảnh), màu + khác 3 album gần nhất ở đâu
    single_slot:             # bài đăng single (gói CLAUDE.md §3: bài điểm nhấn)
    shorts: []               # gói CLAUDE.md §3: 1 Short role A; [{role: A, slot: 1, format, part, hook_angle, picture, version}]
    packaging_version:       # version đóng gói đang thử (một trục mỗi lần)
    success: {metric: views_7d_vs_median, target: }   # kỳ vọng PM chấm lại sau 7 ngày (results.md)

provenance:
  research: []               # [0] = reference set (refset.py), sau đó từng video: [{path, reference, url, channel, video_id, views, subs, published_at, duration}]
  trend: {}                  # {report, topic}
  derived_by:
  confidence_notes: []

hypothesis:
  statement:
  evidence: []               # [{claim, value, source: measured|inferred|description}]
  risks: []

differentiation:
  keep: []
  change: []
  copy_guard:
    titles: []
    branding: []
    visual: []
    hooks: []                  # their hook lines we must not reuse (short phrases, never whole lyrics)
    source_avoid: []           # numbered source refs of theirs (rules.md sources.numbered.format) + free refs
    lyric_rule:

target:
  duration_min: [60, 90]   # sau khi ghép: 1–1,5 giờ, thiếu thì thêm bài (chủ kênh 2026-09-25); tổng slot chưa ghép ≈ ≥ 69 phút
  track_count:
  track_duration: {target: , range: []}
  tempo: {meter: , felt_bpm_qc: , felt_bpm_qc_range: [], reference_measured: , ours_prompt_bpm: , ours_measured: }
  adjacent_bpm_delta_max_pct: 8
  key_policy: {camelot_step_max: 1}
  loudness: {master_lufs: , true_peak_max_dbtp: -1.0, song_lufs_spread_max_lu: 2, first15s_max_below_body_db: }
  vocal: {presence_max_s: {track01: , others: }, first_lyric_max_s: {track01: , others: }, first_hook_max_s: {track01: , others: }, words_per_min: []}
  drums_in_s_max:
  transition: {silence_s: [], styles_mix: , no_adjacent_same_intro_type: true, vocal_to_vocal_crossfades_max: }
  energy_curve: []

identity:
  vocal_persona:
  band_profile:
  persona_decision: {decided: false, owner: PM, recommended: , options: {}}
  suno_voice: {name: , id: , origin_clip: }

style_prompt: {version: , text: , chars: , exclude_styles: , reference_voice: , reference_tempo: }   # text <= 1000 chars, English; genre/instruments from our channel

track01:
  slot: 1
  title:
  source_ref:
  concept:
  hook_phrase:
  opening_spec: []           # [{t: "0-1 s", event: ...}] timeline of the first 15 s of the VIDEO
  lyric_tags_hint:
  lyrics_file: null
  candidates_min:
  gate: []
  single_first: null
  variants: []               # [{name, what changes (intro / first line / hook first), rounds, lyrics_file}]
  reference: {}              # the reference's first 15 s as measured (seeded from reference.yaml criteria.opening)
  reference_recipe: []       # what we take from it, in words - spirit, not copy
  tag_skeleton: []           # optional [{tag, at: "m:ss"}] Suno lyric-tag order; the real arrangement goes in slots[0].arrangement_note
  hook_plan: {}              # optional {line, sung_times, point_of_view}

# slots[0] is authoritative for the title track (album-plan reads slots); track01 adds the brief.
# intro_type vocabulary: channel rules.md research.intro_vocab
# intro_length: cold_open (<3 s) | short (<10 s) | medium (<25 s) | long
experiment: null             # đặc điểm của video tham khảo đáng thử khác house sound (giọng cao, tempo lạ, energy đột biến…):
                             # {axes: [...], what, why, measure}; album-plan chép sang plan.yaml (channel/<ch>/rules.md §1)
slots: []                    # [{n, title, source_ref, theme, emotion, energy (int), valence (int), arc_role, intro_type, intro_length, target_duration "m:ss" (<= 6:00), bpm, hook_phrase, imagery: [], arrangement_note, source: new|library, library_id, lyrics_file}]
library_check: {done: , result: , fallback: }

lyrics_rules: {language: English, structure_default: , forbid: , lines_per_section: {}, words_per_min_target: [], max_chars: 3000, point_of_view: , hook_rule: , source_rule: , outro: , banned: , file_format: }

generation:
  model: v6
  max_mode: false            # CLAUDE.md §4: slot 1 = 2 lượt Max, bài khác = 1 lượt thường; trần album ≤ 250 credits
  settings: {voice: , variety: 0, weirdness: [20, 30], style_influence: {track01: [70, 80], others: [45, 55]}, audio_influence: {others: [60, 75]}, vocal_gender: , duration: {mode: custom, seconds: }, personalize: off}
  order: []
  budget: {credits_per_month: 2500, credits_per_max_gen: 20, gens: {}, total_gens: , total_credits: }
  download: {route: usesuno, official_downloads: 0}

qc: {anchor: , references: , tempo: {target_bpm: , meter: }, style: {positive: [], negative: {}}, intro_types: {}, rules: {outro_no_vocals: true, max_intro_seconds: , duration_range: []}, extra_checks: []}   # -> <album>/selection.yaml

packaging:
  video_title_candidates: []
  title_rules:
  thumbnail_brief: {subject: , hero_object: , setting: , palette: , text: , layout: , avoid: [], file: thumbnail.png}
  description_outline: []     # points for ABOUT THIS VIDEO only (channel template in publish.md is fixed)
  chapters: measured_on_video  # youtube-publish measures them on the uploaded file
  tags: []
  hashtags: []
  ai_disclosure: {youtube_altered_content_label: true}   # YouTube Studio toggle; no AI line in the description

metrics: {track: [ctr, retention_0_15, retention_0_30, retention_1_00, avg_view_duration], targets: {}, compare_to: [], log_to: "<album>/youtube.md"}
open_questions: []           # [{id, q, owner, blocking, default|recommended, blocks}]
next_steps: []               # [{step, consumer, reads: [keys]}]
