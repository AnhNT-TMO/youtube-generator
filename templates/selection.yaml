# Cấu hình chọn bản nháp Suno cho album này (skill verification-audio, verify.py đọc slots, rules.duration_range, anchor).
# Đường dẫn tương đối so với thư mục album.

# anchor: điền tự động khi `verify.py accept --slot 1` (để trống khi đang chọn title track)
# anchor: "audio/tracks/<anchor>.wav"

# Các bài đã được chọn → baseline "bình thường" của album (gồm cả anchor). Album mới chưa có bài nào:
# thêm bài của album CÙNG persona/band để có thang đo ngay từ slot 1.
references:
  - "audio/tracks/*.wav"
  # - "../001-when-the-night-is-long/audio/tracks/*.wav"

tempo:
  target_bpm: 70          # tempo mục tiêu (felt: nhịp chấm đen với 6/8), cũng là số ghi trong Style prompt. album-plan build sinh file này
  meter: "6/8"

# Mô tả thể loại cho CLAP (tiếng Anh). positive = đúng chất album; negative = danh sách "Loại ngay nếu" (CLAUDE.md mục 7).
style:
  positive: []
  negative: {}

# Luật arrangement chung của album
rules:
  outro_no_vocals: true          # tag [Instrumental Outro] ... "No additional vocals"
  max_intro_seconds: 45          # intro dài hơn thì cờ vàng (vẫn cắt được trong CapCut)
  max_intro_seconds_anchor: 15   # title track: vocal/hook nên vào trong 15s đầu (CLAUDE.md mục 3); muộn hơn bị trừ điểm
  duration_range: [210, 450]     # giây
  min_candidates_anchor: 4       # slot 1 (title track): số clip tối thiểu trước khi chốt (= 2 lượt generate)
  min_candidates: 2              # các slot khác

# Vị trí trong album: lyrics lấy từ file track (khối ``` đầu tiên sau "## Lyrics"), energy mục tiêu theo kế hoạch.
slots:
  1:  {track: tracks/01-<slug>.md, energy: 3}
  2:  {track: tracks/02-<slug>.md, energy: 4}
  # ...

# Ghi đè ngưỡng mặc định (xem .claude/skills/verification-audio/scripts/qc/score.py → DEFAULTS) nếu cần, ví dụ:
# thresholds:
#   tempo: {warn: 4, fail: 8}
