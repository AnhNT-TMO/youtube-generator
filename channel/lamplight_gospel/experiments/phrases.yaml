status: approved               # CEO 2026-09-25: chữ chính của mọi ảnh album (visual.md → Chữ chính trên ảnh); single dùng tên bài
sources:
  - research/trends/lamplight_gospel/archive/2026-09-25-packaging/report.md
rules:
  shape: "<GỌI>, <LỜI CẦU XIN>"   # GỌI = LORD | GOD | JESUS | FATHER; ưu tiên ≤ 6 chữ, ngôi thứ nhất, nỗi đau/nỗi sợ sâu nhất của album (visual.md → Chữ chính trên ảnh)
  pick_by: album                 # PM viết 5–8 câu từ linh hồn album, chấm theo visual.md → Chữ chính trên ảnh, chọn câu mạnh nhất; kho này chỉ gợi ý, câu mới được thêm
  no_reuse_days: 14              # một cụm không dùng lại trong 14 ngày; PM ghi used khi chọn
  collision_check: "tra title ngách (research/trends/<ch>/snapshots/) + WebSearch \"<cụm>\" gospel; trùng nguyên cụm → bỏ"
  avoid:                          # đã có nhiều kênh ngách dùng (title hoặc chữ thumbnail), 2026-09-25
    - RESTORE MY SOUL
    - STAY WITH ME TONIGHT
    - SIT WITH ME TONIGHT
    - LEAD ME HOME
    - MY STRENGTH IS GONE
    - I'M HOLDING ON
    - STEP INTO MY STORM
    - STEP INTO MY SITUATION
    - I CAN'T DO THIS ALONE
    - MAKE A WAY WHERE I SEE NO WAY
    - HOLD ME THROUGH THIS STORM
    - THANK YOU FOR ONE MORE DAY
    - HOLD MY FAMILY (TOGETHER)     # Jelly Roll "God Hold My Family" + nhiều kênh ngách (2026-09-25)
