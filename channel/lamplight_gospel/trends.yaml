# Cấu hình R&D của kênh (skill youtube-trend-research). Ranh giới ngách theo channel.md → Hợp đồng kênh.
language: en
own_channel: UCzLzi-pXe9KI4iZFE8hQ44g
window_days: 60            # chỉ xét video đăng trong 60 ngày gần nhất
min_minutes: 20            # video dài (album/mix); Shorts và bài lẻ xét riêng khi cần

discover:                  # search.list = 100 unit / từ khóa; chạy vài lần mỗi tuần
  duration: long
  per_query: 50
  queries:
    - gospel blues
    - christian blues
    - soulful gospel blues
    - deep gospel blues prayer
    - black gospel songs
    - southern gospel soul
    - old gospel songs
    - old hymns gospel
    - old church gospel 60s 70s
    - gospel songs for healing
    - prayer of protection gospel
    - christian prayer songs
    - gospel music for peace
    - gospel songs 1 hour
    - vintage gospel songs
    - gospel soul hymns

niche:                     # kênh vào watchlist khi ≥ min_matches / 50 title gần nhất có một từ lõi dưới đây
  keywords: [gospel, hymn, hymns, christian blues, christian soul, spiritual, spirituals, old church]
  min_matches: 10
  exclude: [khasi, yoruba, ohun, igbagbo, islam, muslim, quran, bollywood, celebrity, magic, kids, amapiano, afro, naija, nigerian, ministration, tagalog, panginoon, louvor, hino, hinos, alabanza, adoracion, praise and worship medley, reggae, trap, rap, drill, dj, hindi, yeshu, masih, telugu, tamil, malayalam, swahili, kiswahili, nyimbo, injili, zambian, zambia, kikuyu, chewa, bemba, ghana, greatest hits, tribute, don moen, r.kelly, nagamese]
  foreign_max_share: 0.3   # tỉ lệ title không phải tiếng Anh tối đa (lời tiếng Anh: channel.md → Hợp đồng kênh)
  max_subs: 1000000        # kênh nghệ sĩ/label lớn không phải đối thủ cùng cỡ
watchlist_max: 200

shorts:                    # trend.py shorts: Short phổ biến nhất trong ngách + sheet khung dọc (0 unit trên snapshot ≤ 2 ngày)
  days: 60                 # cửa sổ ngày đăng (mặc định = window_days)
  top: 20                  # số dòng bảng + số ô sheet
  per_channel: 3           # tối đa Short / kênh trong top (0 = không giới hạn)
  max_seconds: 180         # Short dài tối đa (giới hạn của YouTube)
  discover_queries:        # discover --shorts (search videoDuration=short, 100 unit / từ khóa)
    - gospel shorts
    - gospel song shorts
    - prayer song shorts
    - old hymns shorts
    - soulful gospel shorts
    - christian song lyrics shorts
    - gospel blues shorts
  niche_keywords: [gospel, hymn, hymns, lord, jesus, god, prayer, pray, amen, faith, psalm, worship, christian, blessing]
                           # kênh chuyên Shorts hay không ghi thể loại trong title: bộ từ rộng hơn niche.keywords
  music_keywords: [song, songs, hymn, hymns, gospel, worship, music, sing, singing, choir, blues, soul, lyrics, praise, acapella, a cappella]
                           # kênh Shorts phải là kênh nhạc: ≥ 20 % title có một chữ ở đây
  exclude_extra: [tarot, sermon, sermons, prophetic, prophecy, preacher, pastor, manifest, manifestation, "1111", horoscope, recap, recaps, motivational, motivation]
                           # kênh Shorts nói (giảng, tiên tri, tarot, động lực) không phải nhạc: ngoài hợp đồng kênh
  formats:                 # loại Short đoán từ title; Claude bổ sung bằng mắt trên sheet
    lyrics_card: [lyrics, lyric, sing along, words]
    prayer_blessing: [prayer, pray, amen, bless, blessing, receive, if you see this, type amen, god says, god is telling, message for you, don't skip, dont skip]
    testimony_story: [story, testimony, saved my life, found me, when i was, true story]
    classic_hymn: [amazing grace, how great thou art, it is well, blessed assurance, old rugged cross, hymn, hymns]
    scripture_verse: [psalm, verse, scripture, bible, proverbs, isaiah]
    live_choir: [live, choir, a cappella, acapella, performance, church service]
    night_comfort: [sleep, night, tonight, 3am, can't sleep, midnight]
seed_channels: [UCQ1ukhuMnAWsQ54Zu2ZsRJQ]   # Old Time Peace: kênh hymn mới, ít video (2026-09-25)

