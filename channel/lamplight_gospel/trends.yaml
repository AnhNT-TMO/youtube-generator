branches:                  # nhánh nhạc (âm thanh); nhánh khác house sound → album experiment
  gospel_blues: [blues]
  hymns_vintage: [hymn, hymns, 60s, 70s, old church, old time, old-time, vintage]
  worship: [worship]
  soul_rnb: [soul, soulful, r&b, rnb]
