  surrender_burden: [burden, burdens, surrender, at your feet, let go]
  presence_near: [stay with me, near me, hold me, with me, your arms, never leave, never left, walk with me, you are everything]
  night_sleep: [night, midnight, tonight, 3am, sleep, bedtime]
  morning: [morning, sunrise, dawn]
  grief_loss: [grief, loss, miss you, mama, mother, goodbye, gone home, passed away, widow]
  lonely: [lonely, alone, loneliness]
  nostalgia: [old time, old-time, 60s, 70s, forgotten, they don't sing, grandma, grandpa, childhood, remember, old church]
