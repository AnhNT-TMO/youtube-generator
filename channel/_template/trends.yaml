# Cấu hình R&D của kênh (skill youtube-trend-research). Ranh giới ngách theo channel.md → Hợp đồng kênh.
language: en
own_channel:               # channel id UC… của kênh mình
window_days: 60
min_minutes: 20

discover:                  # search.list = 100 unit / từ khóa
  duration: long
  per_query: 50
  queries: []              # 10–16 cụm người xem gõ cho dòng nhạc của kênh

niche:                     # kênh vào watchlist khi ≥ min_matches / 50 title gần nhất có một từ dưới đây
  keywords: []
  min_matches: 10
watchlist_max: 200

shorts:                    # trend.py shorts: Short phổ biến nhất trong ngách + sheet khung dọc (0 unit trên snapshot ≤ 2 ngày)
  days: 60                 # cửa sổ ngày đăng (mặc định = window_days)
  top: 20                  # số dòng bảng + số ô sheet
  per_channel: 3           # tối đa Short / kênh trong top (0 = không giới hạn)
  max_seconds: 180         # Short dài tối đa (giới hạn của YouTube)
seed_channels: []          # channel id biết sẵn là cùng ngách

topics: {}                 # <chủ đề>: [từ khóa trong title]
branches: {}               # <nhánh nhạc>: [từ khóa trong title]
