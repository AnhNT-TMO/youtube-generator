<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt clip</title>
<style>
:root { --bg:#14151a; --panel:#1e2028; --line:#2c2f3a; --text:#e8e8ec; --muted:#9a9cab; --ok:#3fb36b; --bad:#e0524c; --hero:#f0b429; --head:64px; }
* { box-sizing:border-box; }
html { scroll-snap-type:y mandatory; scroll-padding-top:var(--head); }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
header { position:fixed; top:0; left:0; right:0; height:var(--head); z-index:5; background:rgba(20,21,26,.97); border-bottom:1px solid var(--line); padding:6px 16px; display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; overflow:hidden; }
h1 { font-size:15px; margin:0 8px 0 0; }
select, button, input { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font:inherit; }
button { cursor:pointer; }
button:hover { border-color:var(--muted); }
.stats { color:var(--muted); margin-left:auto; }
.stats b { color:var(--text); }
.help { color:var(--muted); font-size:11px; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
main { padding:var(--head) 16px 0; display:flex; flex-direction:column; align-items:center; }
.card { scroll-snap-align:start; scroll-snap-stop:always; height:calc(100vh - var(--head)); width:100%; padding:10px 0; display:flex; flex-direction:column; }
.frame { flex:1; min-height:0; margin:0 auto; width:100%; max-width:calc((100vh - var(--head) - 120px) * 1248 / 704); background:var(--panel); border:3px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
.card.ok .frame { border-color:var(--ok); }
.card.bad .frame { border-color:var(--bad); }
.card.hero .frame { border-color:var(--hero); box-shadow:0 0 0 2px var(--hero); }
video { width:100%; flex:1; min-height:0; object-fit:contain; background:#000; display:block; }
.body { padding:8px 12px; display:flex; flex-direction:column; gap:4px; }
.top { display:flex; gap:10px; align-items:baseline; }
.id { font-weight:600; font-size:15px; }
.theme, .pos { color:var(--muted); font-size:12px; }
.pos { margin-left:auto; }
.subject, .note { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.subject { color:var(--muted); }
.note { color:#c8c9d4; }
.actions { display:flex; gap:8px; align-items:center; }
.actions button.ok.on { background:var(--ok); border-color:var(--ok); color:#fff; }
.actions button.bad.on { background:var(--bad); border-color:var(--bad); color:#fff; }
.actions button.hero.on { background:var(--hero); border-color:var(--hero); color:#111; }
.actions input { flex:1; min-width:0; }
.empty { padding:80px 0; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Duyệt clip</h1>
  <select id="theme"><option value="">Tất cả nhóm</option></select>
  <select id="status">
    <option value="">Mọi trạng thái</option>
    <option value="none" selected>Chưa duyệt</option>
    <option value="hero">Hero</option>
    <option value="ok">Đạt</option>
    <option value="bad">Loại</option>
  </select>
  <select id="sort"><option value="new">Mới nhất trước</option><option value="name">Theo tên</option><option value="hero">Hero lên đầu</option></select>
  <button id="export">Xuất kết quả (hero + loại)</button>
  <span class="stats" id="stats"></span>
  <div class="help">Cuộn hoặc J/K (↓/↑) = clip sau/trước, clip tự chạy · Space = dừng/chạy · H = hero và sang clip sau · A = đạt và sang clip sau · X = loại, gõ lý do, Enter để sang clip sau · Lựa chọn lưu trong trình duyệt này</div>
</header>

const KEY = "clip-review:resource/wizard-christmas";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} };
try {
  if (!localStorage.getItem(KEY + ":hero-migrated")) {
    Object.values(marks).forEach(m => { if (m.s === "ok") m.s = "hero"; });
    save(); localStorage.setItem(KEY + ":hero-migrated", "1");
  }
} catch (e) {}
const $ = s => document.querySelector(s);
const grid = $("#grid");
let shown = [], current = -1;

[...new Set(ITEMS.map(i => i.theme))].sort().forEach(t => {
  const o = document.createElement("option"); o.value = t; o.textContent = t; $("#theme").appendChild(o);
});

function stats() {
  const ok = ITEMS.filter(i => marks[i.id]?.s === "ok").length;
  const bad = ITEMS.filter(i => marks[i.id]?.s === "bad").length;
  const hero = ITEMS.filter(i => marks[i.id]?.s === "hero").length;
  $("#stats").innerHTML = `<b>${ITEMS.length}</b> clip · hero <b>${hero}</b> · đạt <b>${ok}</b> · loại <b>${bad}</b> · chưa duyệt <b>${ITEMS.length - ok - bad - hero}</b>`;
}

function paint(item, card) {
  const s = marks[item.id]?.s;
  card.classList.toggle("ok", s === "ok");
  card.classList.toggle("bad", s === "bad");
  card.classList.toggle("hero", s === "hero");
  card.querySelector("button.hero").classList.toggle("on", s === "hero");
  card.querySelector("button.ok").classList.toggle("on", s === "ok");
  card.querySelector("button.bad").classList.toggle("on", s === "bad");
}

function setMark(idx, s, toggle = true) {
  const item = shown[idx], card = grid.children[idx], cur = marks[item.id] || {};
  if (toggle && cur.s === s) delete marks[item.id]; else marks[item.id] = { ...cur, s };
  paint(item, card); save(); stats();
}

function preload(idx) {
  [idx, idx + 1].forEach(i => {
    const v = grid.children[i]?.querySelector("video");
    if (v && !v.src) { v.src = v.dataset.src; v.preload = "auto"; }
  });
}

function activate(idx) {
  if (idx === current) return;
  const old = grid.children[current]?.querySelector("video");
  if (old) old.pause();
  current = idx;
  preload(idx);
  const v = grid.children[idx]?.querySelector("video");
  if (v) { v.currentTime = 0; v.play().catch(() => {}); }
}

function go(idx) {
  idx = Math.max(0, Math.min(grid.children.length - 1, idx));
  grid.children[idx]?.scrollIntoView({ behavior: "smooth", block: "start" });
}

const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) activate([...grid.children].indexOf(e.target));
}), { threshold: 0.6 });

function render() {
  const theme = $("#theme").value, st = $("#status").value;
  shown = ITEMS.filter(i => (!theme || i.theme === theme) &&
    (!st || (st === "none" ? !marks[i.id]?.s : marks[i.id]?.s === st)));
  const order = $("#sort").value, isHero = i => marks[i.id]?.s === "hero" ? 0 : 1;
  shown.sort(order === "new" ? (a, b) => b.mtime - a.mtime
    : order === "hero" ? (a, b) => isHero(a) - isHero(b) || b.mtime - a.mtime
    : (a, b) => a.id.localeCompare(b.id));
  io.disconnect(); grid.innerHTML = ""; current = -1;
  if (!shown.length) { grid.innerHTML = '<div class="empty">Không còn clip nào trong bộ lọc này.</div>'; stats(); return; }
  shown.forEach((item, idx) => {
    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `
      <div class="frame">
        <video controls loop muted playsinline preload="none"></video>
        <div class="body">
          <div class="top"><span class="id"></span><span class="theme"></span><span class="pos"></span></div>
          <div class="subject"></div>
          ${item.note ? '<div class="note"></div>' : ""}
          <div class="actions">
            <button class="hero">★ Hero (H)</button><button class="ok">Đạt (A)</button><button class="bad">Loại (X)</button>
            <input placeholder="Lý do loại / ghi chú">
          </div>
        </div>
      </div>`;
    const v = card.querySelector("video");
    v.dataset.src = item.video + "?t=" + Math.round(item.mtime); v.poster = item.poster;
    card.querySelector(".id").textContent = item.shot + (item.attempt > 1 ? ` · lượt ${item.attempt}` : "");
    card.querySelector(".theme").textContent = item.theme;
    card.querySelector(".pos").textContent = `${idx + 1} / ${shown.length}`;
    card.querySelector(".subject").textContent = item.subject;
    if (item.note) card.querySelector(".note").textContent = "Reviewer: " + item.note;
    const inp = card.querySelector("input");
    inp.value = marks[item.id]?.n || "";
    inp.addEventListener("input", () => {
      marks[item.id] = { ...(marks[item.id] || {}), n: inp.value };
      if (inp.value && !marks[item.id].s) marks[item.id].s = "bad";
      paint(item, card); save(); stats();
    });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { inp.blur(); go(idx + 1); } });
    card.querySelector("button.hero").onclick = () => setMark(idx, "hero");
    card.querySelector("button.ok").onclick = () => setMark(idx, "ok");
    card.querySelector("button.bad").onclick = () => { setMark(idx, "bad"); inp.focus(); };
    paint(item, card);
    grid.appendChild(card);
    io.observe(card);
  });
  stats();
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if (current < 0) return;
  const v = grid.children[current]?.querySelector("video");
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); go(current + 1); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); go(current - 1); }
  else if (e.key === " ") { e.preventDefault(); if (v) v.paused ? v.play().catch(() => {}) : v.pause(); }
  else if (e.key === "a") { setMark(current, "ok", false); go(current + 1); }
  else if (e.key === "h") { setMark(current, "hero", false); go(current + 1); }
  else if (e.key === "x") { e.preventDefault(); setMark(current, "bad", false); grid.children[current].querySelector("input").focus(); }
});

$("#export").onclick = () => {
  const bad = ITEMS.filter(i => marks[i.id]?.s === "bad").map(i => ({ id: i.id, note: marks[i.id].n || "" }));
  const heroes = ITEMS.filter(i => marks[i.id]?.s === "hero").map(i => ({ id: i.id, note: marks[i.id].n || "" }));
  const text = JSON.stringify({ set: "resource/wizard-christmas", heroes, rejected: bad }, null, 2);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = "clip-review.json"; a.click();
  navigator.clipboard?.writeText(text).catch(() => {});
};

["#theme", "#status", "#sort"].forEach(s => $(s).addEventListener("change", () => { render(); scrollTo(0, 0); }));
render();
</script>
